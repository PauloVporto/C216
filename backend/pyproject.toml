[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "PauloVPorto",email = "paulo.v@gec.inatel.br"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "requests (>=2.34.2,<3.0.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.0,<2.1)",
    "alembic (>=1.16,<2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosqlite (>=0.21,<1.0)",
    "ruff (>=0.14,<1.0)"
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
