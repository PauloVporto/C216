services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: c216_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://c216:c216@db:5432/c216
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: c216_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: c216
      POSTGRES_USER: c216
      POSTGRES_PASSWORD: c216
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c216 -d c216"]
      interval: 5s
      timeout: 5s
      retries: 5

  tests:
    build:
      context: ./backend
      target: tests
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql://c216:c216@db-test:5432/c216_test
    depends_on:
      db-test:
        condition: service_healthy

  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: c216_test
      POSTGRES_USER: c216
      POSTGRES_PASSWORD: c216
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c216 -d c216_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
