services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: c216_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: c216
      DATABASE_USER: c216
      DATABASE_PASSWORD: c216
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: c216_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: c216
      POSTGRES_USER: c216
      POSTGRES_PASSWORD: c216
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c216 -d c216"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
