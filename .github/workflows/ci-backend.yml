name: CI Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: c216_test
          POSTGRES_USER: c216
          POSTGRES_PASSWORD: c216
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c216 -d c216_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://c216:c216@localhost:5432/c216_test
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar dependências
        run: poetry install --no-root --no-interaction --no-ansi

      - name: Executar testes unitários
        run: poetry run pytest tests/unit -v -m unit

      - name: Executar testes de integração
        run: poetry run pytest tests/integration -v -m integration
